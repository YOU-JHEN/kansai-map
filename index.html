<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>關西・行きたい場所</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#F3F2ED;--ink:#1F2328;--muted:#6B6A64;--line:#D8D5CB;--ai:#2E4A62;--shu:#B3372B;--on-shu:#fff;--serif:"Noto Serif TC","Hiragino Mincho ProN","Yu Mincho","PMingLiU",serif;--sans:"Noto Sans TC","Hiragino Sans","PingFang TC","Microsoft JhengHei",sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181B;--ink:#E8E5DD;--muted:#9B988F;--line:#2D3237;--ai:#9DBAD3;--shu:#C0463A}}
:root[data-theme="dark"]{--bg:#15181B;--ink:#E8E5DD;--muted:#9B988F;--line:#2D3237;--ai:#9DBAD3;--shu:#C0463A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.hero{display:flex;gap:18px;align-items:center;padding-top:36px;padding-bottom:22px}
.stamp{display:inline-grid;place-items:center;flex:none;width:26px;height:26px;background:var(--shu);color:var(--on-shu);font:700 15px/1 var(--serif);border-radius:2px}
.stamp.lg{width:60px;height:60px;font-size:21px;line-height:1.15;text-align:center;border-radius:3px}
h1{margin:0;font:700 27px/1.3 var(--serif);letter-spacing:.14em}
.lead{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.find{display:block;width:100%;margin:4px 0 18px;padding:10px 2px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);font:inherit;-webkit-appearance:none;appearance:none}
.find::placeholder{color:var(--muted)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,.find:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.tabs{gap:22px}
.tab{flex:none;padding:12px 0 10px;border-bottom:2px solid transparent;font:500 15px/1.4 var(--serif);color:var(--muted)}
.tab[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ai)}
.tab small{margin-left:5px;font:400 12px var(--sans)}
.chips{padding:8px 0 10px}
.chip{flex:none;padding:5px 12px;border:1px solid var(--line);border-radius:2px;font-size:13px;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip small,.sub small{margin-left:4px;font-size:11.5px;opacity:.7}
.subs{gap:16px;padding-top:10px}
.subs:empty{display:none}
.sub{flex:none;padding:3px 0;border-bottom:1px solid transparent;font-size:13px;color:var(--muted)}
.sub[aria-pressed=true]{color:var(--ai);border-bottom-color:var(--ai)}
.grp{display:flex;align-items:center;gap:10px;margin:34px 0 2px;font:700 19px/1.3 var(--serif)}
.grp::after{content:"";flex:1;border-top:1px solid var(--line)}
.grp small{font:400 12.5px var(--sans);color:var(--muted);order:3}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.name{font:600 17px/1.45 var(--serif);color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.name:hover{text-decoration:underline;text-decoration-color:var(--ai);text-underline-offset:4px}
.meta{display:flex;flex-wrap:wrap;margin-top:3px;font-size:12.5px;color:var(--muted)}
.meta span+span{margin-left:9px;padding-left:9px;border-left:1px solid var(--line)}
.meta .fr{color:var(--ai)}
.note{margin:7px 0 0;font-size:13.5px;line-height:1.8;color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.item.open .note{display:block;-webkit-line-clamp:unset}
.more{display:none;margin-top:2px;font-size:12.5px;color:var(--ai);text-decoration:underline;text-underline-offset:3px}
.item.clip .more{display:inline}
.go{display:inline-flex;align-items:center;gap:5px;min-height:40px;padding:0 2px 0 8px;font-size:13px;color:var(--ai);text-decoration:none;white-space:nowrap}
.go svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
.go:hover span{text-decoration:underline;text-underline-offset:4px}
.empty{padding:56px 0;text-align:center;color:var(--muted)}
.empty button{margin-top:10px;color:var(--ai);text-decoration:underline;text-underline-offset:3px}
footer{padding:36px 20px 48px;font-size:12px;color:var(--muted)}
@media (max-width:480px){.wrap{padding:0 16px}footer{padding-inline:16px}h1{font-size:23px}.stamp.lg{width:52px;height:52px;font-size:18px}}
</style>
</head>

const B=(k,v,l,n,c)=>`<button class="${c}" data-k="${k}" data-v="${esc(v)}" aria-pressed="${S[k]===v}">${esc(l)}<small>${n}</small></button>`;
function bars(){
  const n=(x,f)=>D.filter(d=>ok(d,x)&&f(d)).length;

  $("#subs").innerHTML=U.length?B("s","","全種類",n("s",()=>1),"sub")+U.map(u=>[u,n("s",d=>d.s===u)]).filter(([u,c])=>c||S.s===u).map(([u,c])=>B("s",u,u,c,"sub")).join(""):"";
}
function list(){
  const it=D.filter(d=>ok(d,"")),el=$("#list");
  if(!it.length){el.innerHTML='<div class="empty"><p>沒有符合的地點。</p><button data-reset>清除篩選</button></div>';return}
  let h="",cur="";

  }
  el.innerHTML=h;measure();
}
function measure(){
  const els=[...document.querySelectorAll(".item")];
  const clip=els.map(i=>{const n=i.querySelector(".note");return !!n&&(i.classList.contains("open")||n.scrollHeight>n.clientHeight+1)});
  els.forEach((i,k)=>i.classList.toggle("clip",clip[k]));
}
function go(){bars();list()}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-k]");

});
